name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name (e.g., v1.2.3)
        required: true
      release_name:
        description: Release title (defaults to tag name)
        required: false
      commit_sha:
        description: Commit SHA to tag (defaults to current SHA)
        required: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag commit
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      release_name: ${{ steps.release_info.outputs.release_name }}
      commit_sha: ${{ steps.release_info.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: release_info
        name: Resolve release metadata
        shell: bash
        run: |
          TAG_NAME='${{ github.event.inputs.tag_name }}'
          RELEASE_NAME='${{ github.event.inputs.release_name }}'
          COMMIT_SHA='${{ github.event.inputs.commit_sha }}'

          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="$TAG_NAME"
          fi

          if [ -z "$COMMIT_SHA" ]; then
            COMMIT_SHA='${{ github.sha }}'
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          TAG_NAME='${{ steps.release_info.outputs.tag_name }}'
          COMMIT_SHA='${{ steps.release_info.outputs.commit_sha }}'
          RELEASE_NAME='${{ steps.release_info.outputs.release_name }}'

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists."
            exit 1
          fi

          git tag -a "$TAG_NAME" "$COMMIT_SHA" -m "$RELEASE_NAME"
          git push origin "$TAG_NAME"

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build wheels
        run: maturin build --release --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [tag, build-wheels]
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag_name }}
          name: ${{ needs.tag.outputs.release_name }}
          files: dist/**/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
